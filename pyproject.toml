[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronostate-kd"
version = "0.1.0"
description = "KD-distilled LoRA adapters hot-swapped under a Markov routing prior, on one free T4."
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers",
  "peft",
  "bitsandbytes",
  "accelerate",
  "datasets",
  "safetensors",
  "sentence-transformers",
  "pyyaml",
  "numpy",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "wandb", "matplotlib"]

[tool.setuptools.packages.find]
include = ["chronostate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
